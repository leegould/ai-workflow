name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # guard.sh diffs against the base branch
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - if: github.event_name == 'pull_request'
        run: make guard BASE=origin/${{ github.base_ref }}
